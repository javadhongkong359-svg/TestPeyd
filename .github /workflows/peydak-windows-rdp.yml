          $utf8Bom = New-Object System.Text.UTF8Encoding $true
          [System.IO.File]::WriteAllText(
            "C:\Peydak-App.ps1",
            ($appHelper -join "`r`n"),
            $utf8Bom
          )
          Write-Host "App helper ready: C:\Peydak-App.ps1"

          . "C:\Peydak-App.ps1"
          $paths = Get-PeydakApiPaths

          if (!(Test-Path $paths.Exe)) {
              Write-Host "ERROR: Application not found!"
              Write-Host "Expected path: $($paths.Exe)"
              if (Test-Path "D:\Peydak\src\Peydak.Api\bin") {
                  Get-ChildItem "D:\Peydak\src\Peydak.Api\bin" -Recurse
              }
              throw "Peydak.Api executable not found."
          }

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "       >>> STARTING PEYDAK API <<<" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "Application: $($paths.Exe)"
          Write-Host "Working dir: $($paths.BinDir)"
          Write-Host "Health URL : http://127.0.0.1:5274/api/health"
          Write-Host ""

          $ProcessId = Start-PeydakApi

          Write-Host "Peydak.Api started successfully."
          Write-Host "PID: $ProcessId"
          Write-PeydakApiCrashLog

          if (Test-Path "C:\Peydak-TelegramNotify.ps1") {
              . "C:\Peydak-TelegramNotify.ps1"
              Notify-AppStarted -ProcessId $ProcessId
          }
      # ==========================================
      # 13. Keep Server Alive
      # GitHub kills the job at 360 minutes.
      # Leave time after this loop for mongodump + zip + FTP upload.
      # ==========================================
      - name: 13. Keep Server Alive
        shell: powershell
        run: |

          $AliveMinutes = 335
          $rdpUser = ""

          if (Test-Path "C:\Peydak-ServerCreds.ps1") {
              . "C:\Peydak-ServerCreds.ps1"
              try {
                  $rdpUser = (Get-PeydakServerCredentials).Username
              }
              catch {
                  Write-Host "Could not read RDP username from secure store." -ForegroundColor Yellow
              }
          }

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "       >>> SERVER IS RUNNING <<<" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green

          Write-Host ""
          if ([string]::IsNullOrWhiteSpace($rdpUser)) {
              Write-Host "RDP login    : see Telegram channel"
          }
          else {
              Write-Host "RDP User     : $rdpUser (password in Telegram start message)"
          }
          Write-Host "MongoDB      : 127.0.0.1:27017"
          Write-Host "Application  : Peydak.Api"
          Write-Host "Alive for    : $AliveMinutes minutes"
          Write-Host "Then         : full Mongo dump, zip, FTP upload"
          Write-Host ""

          if (Test-Path "C:\Peydak-TelegramNotify.ps1") {
              . "C:\Peydak-TelegramNotify.ps1"
              Notify-ServerRunning -AliveMinutes $AliveMinutes -Username $rdpUser
          }

          for ($i = 1; $i -le $AliveMinutes; $i++) {

              Start-Sleep -Seconds 60

              Write-Host "[$i/$AliveMinutes] Server running..."

              if (($i % 10) -eq 0) {
                  Write-Host "Checking MongoDB health..."
                  try {
                      if (Test-Path "C:\Peydak-Mongo.ps1") {
                          . "C:\Peydak-Mongo.ps1"
                          Ensure-PeydakMongoRunning | Out-Null
                      }
                  }
                  catch {
                      Write-Host ("MongoDB health check failed: {0}" -f $_.Exception.Message) -ForegroundColor Yellow
                  }

                  Write-Host "Checking Peydak.Api health..."
                  try {
                      if (Test-Path "C:\Peydak-App.ps1") {
                          . "C:\Peydak-App.ps1"
                          Ensure-PeydakApiRunning | Out-Null
                      }
                  }
                  catch {
                      Write-Host ("Peydak.Api health check failed: {0}" -f $_.Exception.Message) -ForegroundColor Yellow
                  }
              }

              # --- پوش خودکار سشن CLI (فعلاً غیرفعال؛ بعد از دسترسی توکن uncomment کن) ---
              # if (($i % 30) -eq 0) {
              #     Write-Host "Periodic CLI session push (new files only)..."
              #     try { Push-CliSessions -NewOnly $true }
              #     catch { Write-Host "Periodic session push skipped: $($_.Exception.Message)" }
              # }
          }

          Write-Host ""
          Write-Host "Keep-alive finished. Starting FTP backup..."

          if (Test-Path "C:\Peydak-TelegramNotify.ps1") {
              . "C:\Peydak-TelegramNotify.ps1"
              Notify-ServerShuttingDown -AliveMinutes $AliveMinutes
          }
