name: Peydak Windows Cloud RDP

on:
  workflow_dispatch:

  schedule:
    - cron: '0 */6 * * *'

jobs:
  peydak_rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_PORT: ${{ secrets.FTP_PORT }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      # cPanel File Manager: /backupdb/peydak at FTP home root (chmod 750, not public_html)
      FTP_REMOTE_DIRECTORY: ${{ secrets.FTP_REMOTE_DIRECTORY }}
      FTP_REMOTE_FILE: ${{ secrets.FTP_REMOTE_FILE }}
      BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}

    steps:

      # ==========================================
      # 0. Prepare Telegram notifier (shared helper)
      # ASCII-only script: Windows PowerShell breaks on emoji/UTF-8 in GHA temp .ps1
      # ==========================================
      - name: 0. Prepare Telegram notifier
        shell: powershell
        run: |

          $lines = @(
            'function Get-TehranStamp {'
            '    $tz = [TimeZoneInfo]::FindSystemTimeZoneById("Iran Standard Time")'
            '    $tehran = [TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), $tz)'
            '    return $tehran.ToString("yyyy-MM-dd HH:mm:ss")'
            '}'
            'function Get-GitHubRunInfo {'
            '    $runId = $Env:GITHUB_RUN_ID'
            '    $runUrl = "$($Env:GITHUB_SERVER_URL)/$($Env:GITHUB_REPOSITORY)/actions/runs/$runId"'
            '    return @{ RunId = $runId; RunUrl = $runUrl }'
            '}'
            'function Send-TelegramNotify {'
            '    param([Parameter(Mandatory = $true)][string]$Text)'
            '    $token = ("{0}" -f $Env:TELEGRAM_BOT_TOKEN).Trim()'
            '    $chatId = ("{0}" -f $Env:TELEGRAM_CHANNEL_ID).Trim()'
            '    $chatId = $chatId -replace "^[""]+|[""]+$", ""'
            '    if ([string]::IsNullOrWhiteSpace($token) -or [string]::IsNullOrWhiteSpace($chatId)) {'
            '        Write-Host "Telegram secrets not set; skip notify." -ForegroundColor Yellow'
            '        return'
            '    }'
            '    $uri = "https://api.telegram.org/bot$token/sendMessage"'
            '    function Invoke-TgSend([hashtable]$Payload) {'
            '        $json = $Payload | ConvertTo-Json -Compress'
            '        $tmp = Join-Path $env:TEMP ("tg-notify-" + [guid]::NewGuid().ToString("N") + ".json")'
            '        $utf8NoBom = New-Object System.Text.UTF8Encoding $false'
            '        [System.IO.File]::WriteAllText($tmp, $json, $utf8NoBom)'
            '        try {'
            '            $script:TgRaw = & curl.exe -sS -X POST $uri -H "Content-Type: application/json; charset=utf-8" --data-binary ("@" + $tmp)'
            '            if ($LASTEXITCODE -ne 0) { return $null }'
            '            return ($script:TgRaw | ConvertFrom-Json)'
            '        } finally {'
            '            Remove-Item -Force $tmp -ErrorAction SilentlyContinue'
            '        }'
            '    }'
            '    try {'
            '        $htmlPayload = @{ chat_id = $chatId; text = $Text; parse_mode = "HTML"; disable_web_page_preview = $true }'
            '        $resp = Invoke-TgSend $htmlPayload'
            '        if ($resp -and $resp.ok -eq $true) {'
            '            Write-Host "Telegram notification sent."'
            '            return'
            '        }'
            '        $desc = if ($resp) { $resp.description } else { "no response" }'
            '        Write-Host ("Telegram HTML send failed: " + $desc) -ForegroundColor Yellow'
            '        $plain = (($Text -replace "<[^>]+>", "") -replace "&lt;", "<") -replace "&gt;", ">"'
            '        $plain = ($plain -replace "&amp;", "&").Trim()'
            '        $plainPayload = @{ chat_id = $chatId; text = $plain; disable_web_page_preview = $true }'
            '        $resp2 = Invoke-TgSend $plainPayload'
            '        if ($resp2 -and $resp2.ok -eq $true) {'
            '            Write-Host "Telegram notification sent (plain text fallback)."'
            '            return'
            '        }'
            '        $desc2 = if ($resp2) { $resp2.description } else { $script:TgRaw }'
            '        Write-Host ("Telegram API error: " + $desc2) -ForegroundColor Yellow'
            '        Write-Host ("chat_id length=" + $chatId.Length + " (value not printed)") -ForegroundColor Yellow'
            '    } catch {'
            '        Write-Host ("Telegram notification failed: " + $_.Exception.Message) -ForegroundColor Yellow'
            '        if ($script:TgRaw) { Write-Host ("Telegram raw: " + $script:TgRaw) -ForegroundColor Yellow }'
            '    }'
            '}'
            'function Escape-TelegramHtml {'
            '    param([string]$Value)'
            '    if ($null -eq $Value) { return "" }'
            '    $v = ("{0}" -f $Value).Trim()'
            '    return ((($v -replace "&", "&amp;") -replace "<", "&lt;") -replace ">", "&gt;")'
            '}'
            'function Format-RunLink {'
            '    $run = Get-GitHubRunInfo'
            '    $url = Escape-TelegramHtml $run.RunUrl'
            '    $id = Escape-TelegramHtml $run.RunId'
            '    return ("Run: <a href=""{0}"">#{1}</a>" -f $url, $id)'
            '}'
            'function Format-Duration {'
            '    param([TimeSpan]$Duration)'
            '    if ($Duration.TotalHours -ge 1) { return "{0:hh\:mm\:ss}" -f $Duration }'
            '    return "{0:mm\:ss}" -f $Duration'
            '}'
            'function Get-JobElapsedText {'
            '    $started = $Env:GITHUB_RUN_STARTED_AT'
            '    if ([string]::IsNullOrWhiteSpace($started)) { return "" }'
            '    try {'
            '        $startUtc = [DateTime]::Parse('
            '            $started,'
            '            $null,'
            '            [System.Globalization.DateTimeStyles]::RoundtripKind'
            '        ).ToUniversalTime()'
            '        return (Format-Duration ((Get-Date).ToUniversalTime() - $startUtc))'
            '    } catch { return "" }'
            '}'
            'function Notify-ServerReady {'
            '    param([string]$TailscaleIp, [string]$Username, [string]$Password)'
            '    $stamp = Get-TehranStamp'
            '    $msg = @('
            '        "<b>Peydak Server</b>",'
            '        "Status: <b>SERVER STARTED (RDP Ready)</b>",'
            '        "",'
            '        ("Time: <code>{0}</code> (Tehran)" -f $stamp),'
            '        ("Tailscale IP: <code>{0}</code>" -f (Escape-TelegramHtml (("{0}" -f $TailscaleIp) -replace "\r?\n", ", "))),'
            '        ("User: <code>{0}</code>" -f (Escape-TelegramHtml $Username)),'
            '        ("Password: <code>{0}</code>" -f (Escape-TelegramHtml $Password)),'
            '        "Hostname: <code>peydak-github-rdp</code>",'
            '        (Format-RunLink),'
            '        "",'
            '        "Preparing MongoDB and application..."'
            '    ) -join "`n"'
            '    Send-TelegramNotify $msg'
            '}'
            'function Notify-AppStarted {'
            '    param([int]$ProcessId)'
            '    $stamp = Get-TehranStamp'
            '    $backupSource = ("{0}" -f $Env:BACKUP_SOURCE).Trim().ToLowerInvariant()'
            '    if ([string]::IsNullOrWhiteSpace($backupSource)) { $backupSource = "none" }'
            '    $backupLine = switch ($backupSource) {'
            '        "current" { "Backup source: <code>CURRENT</code>" }'
            '        "previous" { "Backup source: <code>PREVIOUS / RECOVERY</code>`nReason: current backup invalid" }'
            '        default { "Backup source: <code>NONE</code>`nMongoDB started empty`nWARNING: No valid backup available on FTP" }'
            '    }'
            '    $msg = @('
            '        "<b>Peydak Server</b>",'
            '        "Status: <b>APPLICATION STARTED</b>",'
            '        "",'
            '        ("Time: <code>{0}</code> (Tehran)" -f $stamp),'
            '        "Process: <code>Peydak.Api</code>",'
            '        ("PID: <code>{0}</code>" -f $ProcessId),'
            '        "MongoDB: <code>127.0.0.1:27017</code>",'
            '        $backupLine,'
            '        (Format-RunLink)'
            '    ) -join "`n"'
            '    Send-TelegramNotify $msg'
            '}'
            'function Notify-ServerRunning {'
            '    param([int]$AliveMinutes, [string]$Username = "")'
            '    $stamp = Get-TehranStamp'
            '    $userLine = if ([string]::IsNullOrWhiteSpace($Username)) {'
            '        "RDP: credentials were sent at server start"'
            '    } else {'
            '        ("RDP User: <code>{0}</code> (password in start message)" -f (Escape-TelegramHtml $Username))'
            '    }'
            '    $msg = @('
            '        "<b>Peydak Server</b>",'
            '        "Status: <b>SERVER IS RUNNING</b>",'
            '        "",'
            '        ("Start time: <code>{0}</code> (Tehran)" -f $stamp),'
            '        ("Keep-alive: <code>{0}</code> minutes" -f $AliveMinutes),'
            '        $userLine,'
            '        "MongoDB: <code>127.0.0.1:27017</code>",'
            '        "App: <code>Peydak.Api</code>",'
            '        (Format-RunLink),'
            '        "",'
            '        "After this period, backup starts and server shuts down."'
            '    ) -join "`n"'
            '    Send-TelegramNotify $msg'
            '}'
            'function Notify-ServerShuttingDown {'
            '    param([int]$AliveMinutes)'
            '    $stamp = Get-TehranStamp'
            '    $msg = @('
            '        "<b>Peydak Server</b>",'
            '        "Status: <b>SERVER SHUTTING DOWN</b>",'
            '        "",'
            '        ("Time: <code>{0}</code> (Tehran)" -f $stamp),'
            '        ("Keep-alive finished (<code>{0}</code> minutes)" -f $AliveMinutes),'
            '        "Next: MongoDB backup + FTP upload",'
            '        (Format-RunLink)'
            '    ) -join "`n"'
            '    Send-TelegramNotify $msg'
            '}'
            'function Notify-BackupStarted {'
            '    $stamp = Get-TehranStamp'
            '    $msg = @('
            '        "<b>Peydak Backup</b>",'
            '        "Status: <b>BACKUP IN PROGRESS</b>",'
            '        "",'
            '        ("Start time: <code>{0}</code> (Tehran)" -f $stamp),'
            '        "Runner: GitHub Actions (Windows)",'
            '        "Target file: <code>peydak-backup.zip</code>",'
            '        "Recovery file: <code>peydak-backup-previous.zip</code>",'
            '        (Format-RunLink),'
            '        "",'
            '        "Please wait until backup finishes..."'
            '    ) -join "`n"'
            '    Send-TelegramNotify $msg'
            '}'
            'function Notify-BackupSucceeded {'
            '    param('
            '        [string]$DurationText,'
            '        [string]$SizeText,'
            '        [long]$ZipBytes,'
            '        [int]$BsonCount,'
            '        [string]$FtpHost,'
            '        [string]$RemotePath,'
            '        [string]$PhaseTimingsText = "",'
            '        [string]$JobElapsedText = "",'
            '        [string]$SevenZipTest = "",'
            '        [string]$BsonValidation = "",'
            '        [string]$FtpLocalSize = "",'
            '        [string]$FtpRemoteSize = "",'
            '        [string]$FtpVerified = "",'
            '        [string]$RotationCurrentToPrevious = "",'
            '        [string]$RotationNewToCurrent = "",'
            '        [string]$RestoreSource = ""'
            '    )'
            '    $stamp = Get-TehranStamp'
            '    $timingLines = @()'
            '    if (-not [string]::IsNullOrWhiteSpace($PhaseTimingsText)) {'
            '        $timingLines += ""'
            '        $timingLines += "<b>Timing breakdown</b>"'
            '        $timingLines += $PhaseTimingsText'
            '    }'
            '    if (-not [string]::IsNullOrWhiteSpace($JobElapsedText)) {'
            '        $timingLines += ("Job elapsed (run start): <code>{0}</code>" -f $JobElapsedText)'
            '    }'
            '    $recoveryLines = @()'
            '    $source = ("{0}" -f $RestoreSource).Trim().ToLowerInvariant()'
            '    if ([string]::IsNullOrWhiteSpace($source)) { $source = ("{0}" -f $Env:BACKUP_SOURCE).Trim().ToLowerInvariant() }'
            '    if ($source -eq "previous") {'
            '        $recoveryLines += ""'
            '        $recoveryLines += "Backup source: <code>PREVIOUS / RECOVERY</code>"'
            '        $recoveryLines += "Reason: current backup invalid"'
            '    } elseif ($source -eq "none") {'
            '        $recoveryLines += ""'
            '        $recoveryLines += "Backup source: <code>NONE</code>"'
            '        $recoveryLines += "WARNING: this run started with empty MongoDB"'
            '    } elseif ($source -eq "current") {'
            '        $recoveryLines += ""'
            '        $recoveryLines += "Backup source: <code>CURRENT</code>"'
            '    }'
            '    $verifyLines = @()'
            '    if (-not [string]::IsNullOrWhiteSpace($SevenZipTest) -or -not [string]::IsNullOrWhiteSpace($FtpVerified)) {'
            '        $verifyLines += ""'
            '        $verifyLines += "<b>New backup validation</b>"'
            '        if (-not [string]::IsNullOrWhiteSpace($SevenZipTest)) { $verifyLines += ("7z test: <code>{0}</code>" -f $SevenZipTest) }'
            '        if (-not [string]::IsNullOrWhiteSpace($BsonValidation)) { $verifyLines += ("BSON validation: <code>{0}</code>" -f $BsonValidation) }'
            '        if (-not [string]::IsNullOrWhiteSpace($FtpLocalSize)) { $verifyLines += ("FTP local size: <code>{0}</code>" -f $FtpLocalSize) }'
            '        if (-not [string]::IsNullOrWhiteSpace($FtpRemoteSize)) { $verifyLines += ("FTP remote size: <code>{0}</code>" -f $FtpRemoteSize) }'
            '        if (-not [string]::IsNullOrWhiteSpace($FtpVerified)) { $verifyLines += ("FTP upload verified: <code>{0}</code>" -f $FtpVerified) }'
            '        if (-not [string]::IsNullOrWhiteSpace($RotationCurrentToPrevious)) { $verifyLines += ("Current -&gt; Previous: <code>{0}</code>" -f $RotationCurrentToPrevious) }'
            '        if (-not [string]::IsNullOrWhiteSpace($RotationNewToCurrent)) { $verifyLines += ("New -&gt; Current: <code>{0}</code>" -f $RotationNewToCurrent) }'
            '    }'
            '    $msg = @('
            '        "<b>Peydak Backup</b>",'
            '        "Status: <b>BACKUP READY AND UPLOADED</b>",'
            '        "",'
            '        ("Finished: <code>{0}</code> (Tehran)" -f $stamp),'
            '        ("Total backup: <code>{0}</code>" -f $DurationText),'
            '        ("Size: <code>{0}</code> ({1} bytes)" -f $SizeText, $ZipBytes),'
            '        ("BSON files: <code>{0}</code>" -f $BsonCount),'
            '        ("FTP Host: <code>{0}</code>" -f $FtpHost),'
            '        ("Path: <code>{0}</code>" -f $RemotePath),'
            '        (Format-RunLink)'
            '    ) + $recoveryLines + $verifyLines + $timingLines'
            '    $msg = $msg -join "`n"'
            '    Send-TelegramNotify $msg'
            '}'
            'function Notify-BackupFailed {'
            '    param('
            '        [string]$ErrorMessage,'
            '        [string]$DurationText = "",'
            '        [string]$PhaseTimingsText = "",'
            '        [string]$JobElapsedText = ""'
            '    )'
            '    $stamp = Get-TehranStamp'
            '    $safe = Escape-TelegramHtml $ErrorMessage'
            '    $timingLines = @()'
            '    if (-not [string]::IsNullOrWhiteSpace($DurationText)) {'
            '        $timingLines += ("Backup elapsed: <code>{0}</code>" -f $DurationText)'
            '    }'
            '    if (-not [string]::IsNullOrWhiteSpace($PhaseTimingsText)) {'
            '        $timingLines += ""'
            '        $timingLines += "<b>Timing breakdown</b>"'
            '        $timingLines += $PhaseTimingsText'
            '    }'
            '    if (-not [string]::IsNullOrWhiteSpace($JobElapsedText)) {'
            '        $timingLines += ("Job elapsed (run start): <code>{0}</code>" -f $JobElapsedText)'
            '    }'
            '    $msg = @('
            '        "<b>Peydak Backup</b>",'
            '        "Status: <b>BACKUP FAILED</b>",'
            '        "",'
            '        ("Error time: <code>{0}</code> (Tehran)" -f $stamp),'
            '        ("Error: <code>{0}</code>" -f $safe),'
            '        "Previous FTP backup preserved",'
            '        (Format-RunLink)'
            '    ) + $timingLines'
            '    $msg = $msg -join "`n"'
            '    Send-TelegramNotify $msg'
            '}'
            'function Notify-BackupRecovery {'
            '    param('
            '        [string]$CurrentExists,'
            '        [string]$CurrentSizeText,'
            '        [string]$CurrentValid,'
            '        [string]$CurrentReason,'
            '        [string]$PreviousExists,'
            '        [string]$PreviousSizeText,'
            '        [string]$PreviousValid,'
            '        [string]$PreviousReason,'
            '        [string]$SelectedSource,'
            '        [string]$RestoreFile = ""'
            '    )'
            '    $stamp = Get-TehranStamp'
            '    $source = ("{0}" -f $SelectedSource).Trim().ToLowerInvariant()'
            '    $status = switch ($source) {'
            '        "current" { "Status: <b>RESTORED FROM CURRENT BACKUP</b>" }'
            '        "previous" { "Status: <b>RESTORED FROM PREVIOUS / RECOVERY</b>" }'
            '        default { "Status: <b>NO VALID BACKUP</b>" }'
            '    }'
            '    $lines = @('
            '        "<b>Peydak Backup Recovery</b>",'
            '        $status,'
            '        "",'
            '        ("Time: <code>{0}</code> (Tehran)" -f $stamp),'
            '        "",'
            '        "<b>Current backup</b>",'
            '        ("Exists: <code>{0}</code>" -f (Escape-TelegramHtml $CurrentExists)),'
            '        ("Size: <code>{0}</code> MB" -f (Escape-TelegramHtml $CurrentSizeText)),'
            '        ("Valid: <code>{0}</code>" -f (Escape-TelegramHtml $CurrentValid))'
            '    )'
            '    if ($CurrentValid -ne "true" -and -not [string]::IsNullOrWhiteSpace($CurrentReason)) {'
            '        $lines += ("Reason: <code>{0}</code>" -f (Escape-TelegramHtml $CurrentReason))'
            '    }'
            '    $lines += @('
            '        "",'
            '        "<b>Recovery backup</b>",'
            '        ("Exists: <code>{0}</code>" -f (Escape-TelegramHtml $PreviousExists)),'
            '        ("Size: <code>{0}</code> MB" -f (Escape-TelegramHtml $PreviousSizeText)),'
            '        ("Valid: <code>{0}</code>" -f (Escape-TelegramHtml $PreviousValid))'
            '    )'
            '    if ($PreviousValid -ne "true" -and $PreviousValid -ne "n/a" -and -not [string]::IsNullOrWhiteSpace($PreviousReason)) {'
            '        $lines += ("Reason: <code>{0}</code>" -f (Escape-TelegramHtml $PreviousReason))'
            '    }'
            '    $lines += ""'
            '    if ($source -eq "current") {'
            '        $lines += "Backup source: <code>CURRENT</code>"'
            '        $lines += ("Restoring: <code>{0}</code>" -f (Escape-TelegramHtml $RestoreFile))'
            '    } elseif ($source -eq "previous") {'
            '        $lines += "Backup source: <code>PREVIOUS / RECOVERY</code>"'
            '        $lines += "Reason: current backup invalid"'
            '        $lines += ("Restoring: <code>{0}</code>" -f (Escape-TelegramHtml $RestoreFile))'
            '    } else {'
            '        $lines += "Backup source: <code>NONE</code>"'
            '        $lines += "MongoDB started empty"'
            '        $lines += "WARNING: No valid backup available on FTP"'
            '    }'
            '    $lines += (Format-RunLink)'
            '    Send-TelegramNotify ($lines -join "`n")'
            '}'
            'function Notify-JobFinished {'
            '    param([string]$JobStatus)'
            '    $stamp = Get-TehranStamp'
            '    $jobElapsed = Get-JobElapsedText'
            '    $status = ("{0}" -f $JobStatus).Trim().ToLowerInvariant()'
            '    switch ($status) {'
            '        "success" {'
            '            $state = "Status: <b>SUCCESS</b>"'
            '            $extra = "Server stopped and this run completed successfully."'
            '        }'
            '        "cancelled" {'
            '            $state = "Status: <b>CANCELLED / INTERRUPTED</b>"'
            '            $extra = "Job may have been cancelled manually or hit timeout."'
            '        }'
            '        default {'
            '            $state = "Status: <b>FAILED</b>"'
            '            $extra = "Check GitHub Actions logs for error details."'
            '        }'
            '    }'
            '    $msg = @('
            '        "<b>Peydak Job</b>",'
            '        $state,'
            '        "",'
            '        ("Time: <code>{0}</code> (Tehran)" -f $stamp),'
            '        ("Job Status: <code>{0}</code>" -f $JobStatus),'
            '        (Format-RunLink)'
            '    )'
            '    if (-not [string]::IsNullOrWhiteSpace($jobElapsed)) {'
            '        $msg += ("Job elapsed (run start): <code>{0}</code>" -f $jobElapsed)'
            '    }'
            '    $msg += @("", $extra)'
            '    $msg = $msg -join "`n"'
            '    Send-TelegramNotify $msg'
            '}'
          )

          $utf8Bom = New-Object System.Text.UTF8Encoding $true
          [System.IO.File]::WriteAllText(
            "C:\Peydak-TelegramNotify.ps1",
            ($lines -join "`r`n"),
            $utf8Bom
          )

          Write-Host "Telegram notifier ready: C:\Peydak-TelegramNotify.ps1"

          $credLines = @(
            '$script:PeydakCredsPath = "C:\ProgramData\Peydak\server-credentials.json"'
            'function New-PeydakRandomUsername {'
            '    $chars = "abcdefghijkmnopqrstuvwxyz23456789"'
            '    $bytes = New-Object byte[] 8'
            '    [System.Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)'
            '    $suffix = -join (0..7 | ForEach-Object { $chars[[int]$bytes[$_] % $chars.Length] })'
            '    return ("pd" + $suffix)'
            '}'
            'function New-PeydakRandomPassword {'
            '    param([int]$Length = 20)'
            '    $lower = "abcdefghijkmnopqrstuvwxyz"'
            '    $upper = "ABCDEFGHJKLMNPQRSTUVWXYZ"'
            '    $digits = "23456789"'
            '    $special = "@#$%&*+-="'
            '    $all = $lower + $upper + $digits + $special'
            '    $bytes = New-Object byte[] ($Length + 4)'
            '    [System.Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)'
            '    $result = @('
            '        $lower[[int]$bytes[0] % $lower.Length],'
            '        $upper[[int]$bytes[1] % $upper.Length],'
            '        $digits[[int]$bytes[2] % $digits.Length],'
            '        $special[[int]$bytes[3] % $special.Length]'
            '    )'
            '    for ($i = 4; $i -lt $Length; $i++) {'
            '        $result += $all[[int]$bytes[$i] % $all.Length]'
            '    }'
            '    return (-join ($result | Get-Random -Count $result.Count))'
            '}'
            'function Save-PeydakServerCredentials {'
            '    param([string]$Username, [string]$Password)'
            '    $dir = Split-Path $script:PeydakCredsPath -Parent'
            '    New-Item -ItemType Directory -Path $dir -Force | Out-Null'
            '    $obj = [ordered]@{'
            '        Username = $Username'
            '        Password = $Password'
            '        CreatedAtUtc = (Get-Date).ToUniversalTime().ToString("o")'
            '    }'
            '    $json = $obj | ConvertTo-Json -Compress'
            '    $utf8 = New-Object System.Text.UTF8Encoding $false'
            '    [System.IO.File]::WriteAllText($script:PeydakCredsPath, $json, $utf8)'
            '    icacls $script:PeydakCredsPath /inheritance:r /grant:r "Administrators:(F)" "SYSTEM:(F)" | Out-Null'
            '    return $script:PeydakCredsPath'
            '}'
            'function Get-PeydakServerCredentials {'
            '    if (!(Test-Path $script:PeydakCredsPath)) {'
            '        throw ("Server credentials file not found: " + $script:PeydakCredsPath)'
            '    }'
            '    return (Get-Content $script:PeydakCredsPath -Raw | ConvertFrom-Json)'
            '}'
            'function New-PeydakServerCredentials {'
            '    $username = New-PeydakRandomUsername'
            '    $password = New-PeydakRandomPassword'
            '    Save-PeydakServerCredentials -Username $username -Password $password | Out-Null'
            '    return [pscustomobject]@{ Username = $username; Password = $password }'
            '}'
          )

          [System.IO.File]::WriteAllText(
            "C:\Peydak-ServerCreds.ps1",
            ($credLines -join "`r`n"),
            $utf8Bom
          )

          Write-Host "Server credentials helper ready: C:\Peydak-ServerCreds.ps1"

      # ==========================================
      # 1. Enable Remote Desktop & Firewall
      # ==========================================
      - name: 1. Enable Remote Desktop & Firewall
        shell: powershell
        run: |

          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0

          Write-Host "Remote Desktop enabled."

      # ==========================================
      # 2. Create Admin Account (random user + password per run)
      # Credentials are masked in GitHub logs and sent only via Telegram.
      # ==========================================
      - name: 2. Create Admin Account
        shell: powershell
        run: |

          if (!(Test-Path "C:\Peydak-ServerCreds.ps1")) {
              throw "Server credentials helper missing."
          }

          . "C:\Peydak-ServerCreds.ps1"
          $creds = New-PeydakServerCredentials

          Write-Host "::add-mask::$($creds.Password)"
          Write-Host "::add-mask::$($creds.Username)"

          $securePassword = ConvertTo-SecureString `
            $creds.Password `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser -Name $creds.Username -ErrorAction SilentlyContinue
          if ($null -eq $existing) {
              New-LocalUser `
                -Name $creds.Username `
                -Password $securePassword `
                -PasswordNeverExpires `
                -ErrorAction Stop
          }
          else {
              Set-LocalUser `
                -Name $creds.Username `
                -Password $securePassword `
                -ErrorAction Stop
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $creds.Username `
            -ErrorAction SilentlyContinue

          Write-Host "Random admin account created."
          Write-Host "Credentials are stored on the runner and will be sent via Telegram after Tailscale connects."

      # ==========================================
      # 3. Install & Connect Tailscale VPN
      # ==========================================
      - name: 3. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        shell: powershell
        run: |

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile "C:\tailscale.msi"

          Write-Host "Installing Tailscale..."

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i C:\tailscale.msi /quiet /norestart" `
            -Wait

          Start-Sleep -Seconds 10

          Write-Host "Connecting Tailscale..."

          & "C:\Program Files\Tailscale\tailscale.exe" up `
            --authkey="$Env:TAILSCALE_AUTHKEY" `
            --hostname="peydak-github-rdp"

          Start-Sleep -Seconds 10

          $ts_ip = & `
            "C:\Program Files\Tailscale\tailscale.exe" `
            ip -4

          if (!(Test-Path "C:\Peydak-ServerCreds.ps1")) {
              throw "Server credentials helper missing."
          }

          . "C:\Peydak-ServerCreds.ps1"
          $rdpCreds = Get-PeydakServerCredentials

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "       >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "RDP login    : sent to Telegram channel (not shown in logs)" -ForegroundColor Yellow
          Write-Host ""
          Write-Host "Connect using Remote Desktop:"
          Write-Host "mstsc -> $ts_ip"
          Write-Host "==================================================" -ForegroundColor Green

          if (Test-Path "C:\Peydak-TelegramNotify.ps1") {
              . "C:\Peydak-TelegramNotify.ps1"
              Notify-ServerReady `
                -TailscaleIp "$ts_ip" `
                -Username "$($rdpCreds.Username)" `
                -Password "$($rdpCreds.Password)"
          }
      # ==========================================
      # 4. Install MongoDB
      # GitHub windows-latest ships docker.exe, but the engine pipe is
      # usually not running, so native MSI is the reliable path.
      # ==========================================
      - name: 4. Install MongoDB
        shell: powershell
        run: |

          $MongoVersion = "8.0.28"
          $MongoUrl = "https://fastdl.mongodb.org/windows/mongodb-windows-x86_64-$MongoVersion-signed.msi"
          $MongoMsi = "C:\mongodb.msi"

          Write-Host "Downloading MongoDB $MongoVersion..."

          Invoke-WebRequest -Uri $MongoUrl -OutFile $MongoMsi

          if (!(Test-Path $MongoMsi)) {
              throw "MongoDB MSI download failed."
          }

          Write-Host "Installing MongoDB Server only (skip Compass)..."

          # Default MSI also installs Compass (huge Electron GUI) and can take ~20 min.
          # ADDLOCAL=Server,ServerService + SHOULD_INSTALL_COMPASS=0 installs only mongod.
          Start-Process msiexec.exe -ArgumentList "/i `"$MongoMsi`" /qn /norestart ADDLOCAL=`"Server,ServerService`" SHOULD_INSTALL_COMPASS=`"0`"" -Wait
          Start-Sleep -Seconds 10

          $MongoService = Get-Service -Name "MongoDB" -ErrorAction SilentlyContinue
          if ($null -eq $MongoService) {
              throw "MongoDB service was not found after MSI install."
          }

          Write-Host "MongoDB service found."

      # ==========================================
      # 5. Start MongoDB
      # App / mongorestore / mongodump use 127.0.0.1:27017
      # ==========================================
      - name: 5. Start MongoDB
        shell: powershell
        run: |

          $MongoData = "C:\MongoDB\data\db"

          if (Test-Path "C:\MongoDB") {
              Write-Host "Removing old MongoDB directory..."
              Remove-Item "C:\MongoDB" -Recurse -Force
          }

          New-Item -ItemType Directory -Path $MongoData -Force | Out-Null

          Write-Host "Searching for mongod.exe..."

          $MongoExe = $null
          $MongoSearchPaths = @(
              "C:\Program Files\MongoDB",
              "C:\Program Files (x86)\MongoDB"
          )

          foreach ($SearchPath in $MongoSearchPaths) {
              if (Test-Path $SearchPath) {
                  $FoundMongo = Get-ChildItem `
                    -Path $SearchPath `
                    -Recurse `
                    -Filter "mongod.exe" `
                    -File `
                    -ErrorAction SilentlyContinue |
                    Select-Object -First 1

                  if ($null -ne $FoundMongo) {
                      $MongoExe = $FoundMongo.FullName
                      break
                  }
              }
          }

          if ($null -eq $MongoExe) {
              throw "mongod.exe was not found on this Windows runner."
          }

          Write-Host "MongoDB executable: $MongoExe"
          Write-Host "Data directory    : $MongoData"

          Get-Service -Name "MongoDB" -ErrorAction SilentlyContinue |
            Stop-Service -Force -ErrorAction SilentlyContinue

          Write-Host "Starting mongod..."

          $MongoProcess = Start-Process `
            -FilePath $MongoExe `
            -ArgumentList "--dbpath `"$MongoData`" --bind_ip 127.0.0.1 --port 27017" `
            -WindowStyle Hidden `
            -PassThru

          Write-Host "MongoDB PID: $($MongoProcess.Id)"

          Add-Content -Path $Env:GITHUB_ENV -Value "MONGO_EXE=$MongoExe"
          Add-Content -Path $Env:GITHUB_ENV -Value "MONGO_DATA=$MongoData"

          Write-Host "Waiting for MongoDB on port 27017..."

          $MongoReady = $false
          for ($i = 1; $i -le 30; $i++) {
              Start-Sleep -Seconds 1

              if ($MongoProcess.HasExited) {
                  throw "MongoDB process stopped unexpectedly. Exit code: $($MongoProcess.ExitCode)"
              }

              try {
                  $tcp = New-Object System.Net.Sockets.TcpClient
                  $iar = $tcp.BeginConnect("127.0.0.1", 27017, $null, $null)
                  $ok = $iar.AsyncWaitHandle.WaitOne(1000, $false)
                  if ($ok) {
                      $tcp.EndConnect($iar)
                      $MongoReady = $true
                  }
                  $tcp.Close()
              }
              catch { }

              if ($MongoReady) {
                  Write-Host "MongoDB is listening on port 27017." -ForegroundColor Green
                  break
              }

              Write-Host "Waiting for MongoDB... [$i/30]"
          }

          if (!$MongoReady) {
              throw "MongoDB did not start on port 27017."
          }

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "       >>> MONGODB IS RUNNING <<<" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "Address : mongodb://127.0.0.1:27017"
          Write-Host "PID     : $($MongoProcess.Id)"
          Write-Host "Data    : $MongoData"
          Write-Host "Mongo   : $MongoExe"
          Write-Host "==================================================" -ForegroundColor Green

          $mongoHelper = @(
            'function Test-PeydakMongoPort {'
            '    param([int]$TimeoutMs = 2000)'
            '    $client = $null'
            '    try {'
            '        $client = New-Object System.Net.Sockets.TcpClient'
            '        $iar = $client.BeginConnect("127.0.0.1", 27017, $null, $null)'
            '        $ok = $iar.AsyncWaitHandle.WaitOne($TimeoutMs, $false)'
            '        if ($ok) { $client.EndConnect($iar); return $true }'
            '    } catch { }'
            '    finally { if ($client) { $client.Close() } }'
            '    return $false'
            '}'
            'function Ensure-PeydakMongoRunning {'
            '    param([switch]$ThrowOnFailure)'
            '    if (Test-PeydakMongoPort) {'
            '        Write-Host "MongoDB is listening on 127.0.0.1:27017."'
            '        return $true'
            '    }'
            '    Write-Host "MongoDB port 27017 is down. Restarting mongod..." -ForegroundColor Yellow'
            '    $exe = $Env:MONGO_EXE'
            '    $data = $Env:MONGO_DATA'
            '    if ([string]::IsNullOrWhiteSpace($data)) { $data = "C:\MongoDB\data\db" }'
            '    if ([string]::IsNullOrWhiteSpace($exe) -or !(Test-Path $exe)) {'
            '        $found = Get-ChildItem -Path @("C:\Program Files\MongoDB","C:\Program Files (x86)\MongoDB") -Recurse -Filter "mongod.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1'
            '        if ($found) { $exe = $found.FullName }'
            '    }'
            '    if ([string]::IsNullOrWhiteSpace($exe) -or !(Test-Path $exe)) {'
            '        if ($ThrowOnFailure) { throw "mongod.exe was not found. Cannot restart MongoDB." }'
            '        return $false'
            '    }'
            '    if (!(Test-Path $data)) { New-Item -ItemType Directory -Path $data -Force | Out-Null }'
            '    Get-Process -Name "mongod" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue'
            '    Start-Sleep -Seconds 2'
            '    Start-Process -FilePath $exe -ArgumentList "--dbpath `"$data`" --bind_ip 127.0.0.1 --port 27017" -WindowStyle Hidden | Out-Null'
            '    for ($n = 1; $n -le 30; $n++) {'
            '        Start-Sleep -Seconds 2'
            '        if (Test-PeydakMongoPort) {'
            '            Write-Host "MongoDB is listening on 127.0.0.1:27017."'
            '            return $true'
            '        }'
            '        Write-Host ("Waiting for MongoDB after restart... [{0}/30]" -f $n)'
            '    }'
            '    if ($ThrowOnFailure) { throw "MongoDB is not listening on 127.0.0.1:27017. Cannot create backup." }'
            '    return $false'
            '}'
          )

          $utf8Bom = New-Object System.Text.UTF8Encoding $true
          [System.IO.File]::WriteAllText(
            "C:\Peydak-Mongo.ps1",
            ($mongoHelper -join "`r`n"),
            $utf8Bom
          )
          Write-Host "Mongo helper ready: C:\Peydak-Mongo.ps1"

      # ==========================================
      # 5b. Checkout FTP backup helper (same commit as this workflow)
      # ==========================================
      - name: 5b. Checkout FTP backup helper
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true

      - name: 5c. Stage FTP backup helper
        shell: powershell
        run: |

          $src = Join-Path $Env:GITHUB_WORKSPACE "scripts\Peydak-BackupFtp.ps1"
          if (!(Test-Path $src)) {
              throw "Backup helper missing after checkout: $src"
          }
          Copy-Item $src "C:\Peydak-BackupFtp.ps1" -Force
          Write-Host "Backup helper staged: C:\Peydak-BackupFtp.ps1"

      # ==========================================
      # 6. Download MongoDB Backup from FTP
      # Tries current, then previous. Invalid local copies are deleted;
      # FTP files are never deleted during restore.
      # ==========================================
      - name: 6. Download MongoDB Backup from FTP
        shell: powershell
        run: |

          if (!(Test-Path "C:\Peydak-BackupFtp.ps1")) {
              throw "Backup helper missing: C:\Peydak-BackupFtp.ps1"
          }
          . "C:\Peydak-BackupFtp.ps1"

          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "       >>> DOWNLOADING BACKUP FROM FTP <<<" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Cyan

          try {
              $decision = Select-PeydakRestoreBackup
          }
          finally {
              Remove-PeydakFtpCurlConfig
          }

          if (Test-Path "C:\Peydak-TelegramNotify.ps1") {
              . "C:\Peydak-TelegramNotify.ps1"
              $previousValidText = if ($decision.Previous.Valid) {
                  "true"
              } elseif ($decision.Source -eq "current") {
                  "n/a"
              } else {
                  "false"
              }
              Notify-BackupRecovery `
                -CurrentExists ($(if ($decision.Current.Exists) { "true" } else { "false" })) `
                -CurrentSizeText $decision.Current.SizeMb `
                -CurrentValid ($(if ($decision.Current.Valid) { "true" } else { "false" })) `
                -CurrentReason $decision.Current.Reason `
                -PreviousExists ($(if ($decision.Previous.Exists) { "true" } else { "false" })) `
                -PreviousSizeText $decision.Previous.SizeMb `
                -PreviousValid $previousValidText `
                -PreviousReason $decision.Previous.Reason `
                -SelectedSource $decision.Source `
                -RestoreFile $decision.RestoreFile
          }

          # Missing/invalid backups must not fail the job: empty MongoDB is allowed only then.
          exit 0

      # ==========================================
      # 7. Verify extracted MongoDB Backup
      # Extraction and CLI session restore already happened in step 6
      # from the same selected archive.
      # ==========================================
      - name: 7. Verify extracted MongoDB Backup
        if: env.BACKUP_FOUND == 'true'
        shell: powershell
        run: |

          $ExtractPath = "C:\PeydakMongoBackup"
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "       >>> VERIFYING EXTRACTED BACKUP <<<" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host ("Selected restore source: {0}" -f $Env:BACKUP_SOURCE)

          if (!(Test-Path $ExtractPath)) {
              throw "Extracted backup was not found: $ExtractPath"
          }

          $BsonFiles = @(Get-ChildItem $ExtractPath -Recurse -Filter "*.bson" -File -ErrorAction SilentlyContinue)
          if ($BsonFiles.Count -eq 0) {
              throw "No BSON files were found in the selected backup extract."
          }

          Write-Host ("BSON files ready for restore: {0}" -f $BsonFiles.Count) -ForegroundColor Green
          $BsonFiles | Select-Object FullName, Length | Format-Table -AutoSize

          $CliSessionsDest = "C:\PeydakCliSessions"
          $hostSessions = @(Get-ChildItem $CliSessionsDest -Recurse -File -Filter "*.session" -ErrorAction SilentlyContinue)
          if ($hostSessions.Count -gt 0) {
              Write-Host ("CLI sessions already staged from the selected backup: {0}" -f $hostSessions.Count)
          }
          else {
              $CliSessionsZip = Get-ChildItem $ExtractPath -Recurse -Filter "peydak-cli-sessions.zip" -File -ErrorAction SilentlyContinue |
                  Select-Object -First 1
              if ($null -ne $CliSessionsZip) {
                  $SevenZipPaths = @(
                      "C:\Program Files\7-Zip\7z.exe",
                      "C:\Program Files (x86)\7-Zip\7z.exe"
                  )
                  $SevenZip = $SevenZipPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
                  if ($null -eq $SevenZip) { throw "7-Zip was not found while restoring CLI sessions." }
                  Write-Host "Restoring CLI session files from the selected backup..."
                  New-Item -ItemType Directory -Path $CliSessionsDest -Force | Out-Null
                  & $SevenZip x $CliSessionsZip.FullName "-o$CliSessionsDest" "-y"
                  Write-Host "CLI sessions staged at $CliSessionsDest"
              }
              else {
                  Write-Host "No peydak-cli-sessions.zip in selected backup (older backup or first run)."
              }
          }

      # ==========================================
      # 8. Restore MongoDB
      # ==========================================
      - name: 8. Restore MongoDB
        if: env.BACKUP_FOUND == 'true'
        shell: powershell
        run: |

          Write-Host "Searching for MongoDB dump..."

          $ExtractPath = "C:\PeydakMongoBackup"

          # Find first BSON file
          $BsonFile = Get-ChildItem `
            $ExtractPath `
            -Recurse `
            -Filter "*.bson" `
            -File `
            | Select-Object -First 1

          if ($null -eq $BsonFile) {
              throw "No BSON files were found in the backup."
          }

          Write-Host "Found BSON:"
          Write-Host $BsonFile.FullName

          # Standard mongodump structure:
          #
          # dump/
          #   database/
          #      collection.bson
          #
          # Therefore:
          # BSON parent      = database
          # database parent  = dump

          $DatabaseFolder = Split-Path `
            $BsonFile.FullName `
            -Parent

          $DumpFolder = Split-Path `
            $DatabaseFolder `
            -Parent

          Write-Host ""
          Write-Host "MongoDB dump directory:"
          Write-Host $DumpFolder

          # Find mongorestore
          $MongoRestore = $null

          $PossiblePaths = @(
              "C:\Program Files\MongoDB\Tools\100\bin\mongorestore.exe",
              "C:\Program Files\MongoDB\Tools\100.16\bin\mongorestore.exe",
              "C:\Program Files\MongoDB\Tools\100.16.1\bin\mongorestore.exe"
          )

          foreach ($Path in $PossiblePaths) {

              if (Test-Path $Path) {
                  $MongoRestore = $Path
                  break
              }
          }

          # If not installed, download MongoDB Database Tools
          if ($null -eq $MongoRestore) {

              Write-Host "MongoDB Database Tools not found."

              $ToolsZip = "C:\mongodb-tools.zip"

              Write-Host "Downloading MongoDB Database Tools..."

              Invoke-WebRequest `
                "https://fastdl.mongodb.org/tools/db/mongodb-database-tools-windows-x86_64-100.16.1.zip" `
                -OutFile $ToolsZip

              $ToolsExtract = "C:\MongoDBTools"

              if (Test-Path $ToolsExtract) {

                  Remove-Item `
                    $ToolsExtract `
                    -Recurse `
                    -Force
              }

              Expand-Archive `
                -Path $ToolsZip `
                -DestinationPath $ToolsExtract `
                -Force

              $MongoRestore = Get-ChildItem `
                $ToolsExtract `
                -Recurse `
                -Filter "mongorestore.exe" `
                -File `
                | Select-Object -First 1 `
                | Select-Object -ExpandProperty FullName
          }

          if ($null -eq $MongoRestore -or !(Test-Path $MongoRestore)) {
              throw "mongorestore.exe was not found."
          }

          Write-Host ""
          Write-Host "mongorestore:"
          Write-Host $MongoRestore

          Write-Host ""
          Write-Host "Restoring MongoDB..."

          & $MongoRestore `
            --host "127.0.0.1:27017" `
            --drop `
            "$DumpFolder"

          if ($LASTEXITCODE -ne 0) {
              throw "MongoDB restore failed."
          }

          $restoreSource = ("{0}" -f $Env:BACKUP_SOURCE).Trim().ToLowerInvariant()
          if ($restoreSource -eq "previous") {
              Write-Host "MongoDB restored successfully from PREVIOUS backup." -ForegroundColor Yellow
          }
          else {
              Write-Host "MongoDB restored successfully from CURRENT backup." -ForegroundColor Green
          }

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "       >>> MONGODB RESTORE COMPLETED <<<" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host ("Selected restore source: {0}" -f $restoreSource.ToUpper())

          Write-Host ""
          Write-Host "Removing local backup files after restore..."

          $BackupZip = "C:\peydak-backup.zip"
          if (Test-Path $BackupZip) {
              Remove-Item $BackupZip -Force -ErrorAction SilentlyContinue
              Write-Host "Deleted backup zip: $BackupZip"
          }

          if (Test-Path $ExtractPath) {
              Remove-Item $ExtractPath -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "Deleted extracted backup: $ExtractPath"
          }

      # ==========================================
      # 9. Clone Peydak Repository
      # ==========================================
      - name: 9. Clone Peydak Repository
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: powershell
        run: |

          Write-Host "Preparing repository directory..."

          if (Test-Path "D:\Peydak") {

              Remove-Item `
                "D:\Peydak" `
                -Recurse `
                -Force
          }

          Write-Host "Cloning repository..."

          git clone `
            "https://x-access-token:$Env:GH_TOKEN@github.com/javadnoruzi/Peydak.git" `
            "D:\Peydak"

          if ($LASTEXITCODE -ne 0) {
              throw "Git clone failed."
          }

          Write-Host "Repository cloned successfully."

          $CliSessionsDest = "C:\PeydakCliSessions"
          $RepoSessions = "D:\Peydak\telegram-cli-sessions"
          if (!(Test-Path $CliSessionsDest)) {
              New-Item -ItemType Directory -Path $CliSessionsDest -Force | Out-Null
          }

          $hostSessions = @(Get-ChildItem `
            $CliSessionsDest `
            -Recurse `
            -File `
            -Filter "*.session" `
            -ErrorAction SilentlyContinue)

          if ($hostSessions.Count -gt 0) {
              Write-Host "Using $($hostSessions.Count) CLI session file(s) from host $CliSessionsDest"
          }
          elseif (Test-Path $RepoSessions) {
              $seed = @(Get-ChildItem `
                $RepoSessions `
                -File `
                -Filter "*.session" `
                -ErrorAction SilentlyContinue)

              foreach ($file in $seed) {
                  Copy-Item $file.FullName -Destination (Join-Path $CliSessionsDest $file.Name) -Force
                  Write-Host "Seeded CLI session onto host: $($file.Name)"
              }

              if ($seed.Count -eq 0) {
                  Write-Host "No CLI session files in backup or repo; login will be required."
              }
          }
          else {
              Write-Host "No CLI session files on host or in repo; login will be required."
          }

      # ==========================================
      # 10. Restore .NET Dependencies
      # ==========================================
      - name: 10. Restore .NET Dependencies
        shell: powershell
        run: |

          cd D:\Peydak

          Write-Host "Running dotnet restore..."

          dotnet restore

          if ($LASTEXITCODE -ne 0) {
              throw "dotnet restore failed."
          }

          Write-Host "Restore completed successfully."

      # ==========================================
      # 11. Build Peydak.Api
      # ==========================================
      - name: 11. Build Peydak.Api
        shell: powershell
        run: |

          cd D:\Peydak

          Write-Host "Building Peydak.Api..."

          dotnet build `
            .\src\Peydak.Api\Peydak.Api.csproj `
            -c Debug `
            --no-restore

          if ($LASTEXITCODE -ne 0) {
              throw "dotnet build failed."
          }

          Write-Host "Build completed successfully."

      # ==========================================
      # 12. Run Peydak.Api
      # WorkingDirectory must be bin (not project src) so appsettings/deps resolve.
      # Do not use Start-Process -RedirectStandard* — pipe buffers deadlock ASP.NET logging.
      # ==========================================
      - name: 12. Run Peydak.Api
        shell: powershell
        run: |

          $appHelper = @(
            'function Test-PeydakApiHealth {'
            '    param([int]$TimeoutSec = 5)'
            '    try {'
            '        $r = Invoke-WebRequest -Uri "http://127.0.0.1:5274/api/health" -UseBasicParsing -TimeoutSec $TimeoutSec'
            '        return $r.StatusCode -eq 200'
            '    } catch { return $false }'
            '}'
            'function Get-PeydakApiPaths {'
            '    $bin = "D:\Peydak\src\Peydak.Api\bin\Debug\net8.0"'
            '    return @{'
            '        BinDir = $bin'
            '        Exe = Join-Path $bin "Peydak.Api.exe"'
            '        CrashLog = Join-Path $bin "peydak-startup-error.log"'
            '    }'
            '}'
            'function Set-PeydakApiEnvironment {'
            '    $env:ASPNETCORE_URLS = "http://127.0.0.1:5274"'
            '    $env:ASPNETCORE_ENVIRONMENT = "Production"'
            '    $env:MongoDb__ConnectionString = "mongodb://127.0.0.1:27017"'
            '}'
            'function Write-PeydakApiCrashLog {'
            '    $crash = (Get-PeydakApiPaths).CrashLog'
            '    if (Test-Path $crash) {'
            '        Write-Host ("----- startup-error (" + $crash + ") -----") -ForegroundColor Yellow'
