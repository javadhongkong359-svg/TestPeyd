      # ==========================================
      # 14. Dump MongoDB, zip with password, upload to FTP
      # ==========================================
      - name: 14. Backup MongoDB and Upload to FTP
        if: always()
        shell: powershell
        run: |

          $BackupZip = "C:\peydak-backup.zip"
          $DumpOut = "C:\PeydakMongoDump"
          $BackupStartedAtUtc = (Get-Date).ToUniversalTime()

          if (Test-Path "C:\Peydak-TelegramNotify.ps1") {
              . "C:\Peydak-TelegramNotify.ps1"
          }
          else {
              function Notify-BackupStarted { Write-Host "Notifier missing; skip Telegram." -ForegroundColor Yellow }
              function Notify-BackupSucceeded {
                  param(
                      [string]$DurationText,
                      [string]$SizeText,
                      [long]$ZipBytes,
                      [int]$BsonCount,
                      [string]$FtpHost,
                      [string]$RemotePath,
                      [string]$PhaseTimingsText = "",
                      [string]$JobElapsedText = "",
                      [string]$SevenZipTest = "",
                      [string]$BsonValidation = "",
                      [string]$FtpLocalSize = "",
                      [string]$FtpRemoteSize = "",
                      [string]$FtpVerified = "",
                      [string]$RotationCurrentToPrevious = "",
                      [string]$RotationNewToCurrent = "",
                      [string]$RestoreSource = ""
                  )
                  Write-Host "Notifier missing; skip Telegram." -ForegroundColor Yellow
              }
              function Notify-BackupFailed {
                  param(
                      [string]$ErrorMessage,
                      [string]$DurationText = "",
                      [string]$PhaseTimingsText = "",
                      [string]$JobElapsedText = ""
                  )
                  Write-Host "Notifier missing; skip Telegram." -ForegroundColor Yellow
              }
              function Notify-BackupRecovery {
                  param(
                      [string]$CurrentExists,
                      [string]$CurrentSizeText,
                      [string]$CurrentValid,
                      [string]$CurrentReason,
                      [string]$PreviousExists,
                      [string]$PreviousSizeText,
                      [string]$PreviousValid,
                      [string]$PreviousReason,
                      [string]$SelectedSource,
                      [string]$RestoreFile = ""
                  )
                  Write-Host "Notifier missing; skip Telegram." -ForegroundColor Yellow
              }
          }

          function Format-ByteSize([long]$Bytes) {
              if ($Bytes -ge 1GB) { return "{0:N2} GB" -f ($Bytes / 1GB) }
              if ($Bytes -ge 1MB) { return "{0:N2} MB" -f ($Bytes / 1MB) }
              if ($Bytes -ge 1KB) { return "{0:N2} KB" -f ($Bytes / 1KB) }
              return "$Bytes B"
          }

          $BackupPhaseTimings = [ordered]@{}

          function Start-BackupPhase([string]$Name) {
              $script:BackupCurrentPhase = $Name
              $script:BackupPhaseStartedAt = (Get-Date).ToUniversalTime()
          }

          function Complete-BackupPhase {
              if ([string]::IsNullOrWhiteSpace($script:BackupCurrentPhase)) { return }
              $elapsed = (Get-Date).ToUniversalTime() - $script:BackupPhaseStartedAt
              $BackupPhaseTimings[$script:BackupCurrentPhase] = $elapsed
              Write-Host ("Phase [{0}] took {1}" -f $script:BackupCurrentPhase, (Format-Duration $elapsed))
              $script:BackupCurrentPhase = $null
              $script:BackupPhaseStartedAt = $null
          }

          function Get-PhaseTimingsText {
              $lines = New-Object System.Collections.Generic.List[string]
              foreach ($phase in $BackupPhaseTimings.Keys) {
                  $lines.Add(("  {0}: <code>{1}</code>" -f $phase, (Format-Duration $BackupPhaseTimings[$phase])))
              }
              return ($lines -join "`n")
          }

          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "       >>> FULL MONGODB BACKUP TO FTP <<<" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Cyan

          Notify-BackupStarted

          try {

          if ([string]::IsNullOrWhiteSpace($Env:FTP_HOST)) {
              throw "FTP_HOST GitHub Secret is not configured."
          }

          if ([string]::IsNullOrWhiteSpace($Env:FTP_PORT)) {
              throw "FTP_PORT GitHub Secret is not configured."
          }

          if ([string]::IsNullOrWhiteSpace($Env:FTP_USERNAME)) {
              throw "FTP_USERNAME GitHub Secret is not configured."
          }

          if ([string]::IsNullOrWhiteSpace($Env:FTP_PASSWORD)) {
              throw "FTP_PASSWORD GitHub Secret is not configured."
          }

          if ([string]::IsNullOrWhiteSpace($Env:FTP_REMOTE_DIRECTORY)) {
              throw "FTP_REMOTE_DIRECTORY GitHub Secret is not configured."
          }

          if ([string]::IsNullOrWhiteSpace($Env:FTP_REMOTE_FILE)) {
              throw "FTP_REMOTE_FILE GitHub Secret is not configured."
          }

          if ([string]::IsNullOrWhiteSpace($Env:BACKUP_PASSWORD)) {
              throw "BACKUP_PASSWORD GitHub Secret is not configured."
          }

          if (Test-Path "C:\Peydak-Mongo.ps1") {
              . "C:\Peydak-Mongo.ps1"
              Ensure-PeydakMongoRunning -ThrowOnFailure | Out-Null
          }
          else {
              $mongoReady = $false
              try {
                  $tcp = New-Object System.Net.Sockets.TcpClient
                  $iar = $tcp.BeginConnect("127.0.0.1", 27017, $null, $null)
                  $mongoReady = $iar.AsyncWaitHandle.WaitOne(2000, $false)
                  if ($mongoReady) { $tcp.EndConnect($iar) }
                  $tcp.Close()
              }
              catch {
                  $mongoReady = $false
              }

              if (-not $mongoReady) {
                  throw "MongoDB is not listening on 127.0.0.1:27017. Cannot create backup."
              }
          }

          $mongoDump = $null
          $searchRoots = @(
              "C:\MongoDBTools",
              "C:\Program Files\MongoDB",
              "C:\Program Files (x86)\MongoDB"
          )

          foreach ($root in $searchRoots) {
              if (Test-Path $root) {
                  $found = Get-ChildItem `
                    -Path $root `
                    -Recurse `
                    -Filter "mongodump.exe" `
                    -File `
                    -ErrorAction SilentlyContinue |
                    Select-Object -First 1

                  if ($null -ne $found) {
                      $mongoDump = $found.FullName
                      break
                  }
              }
          }

          if ($null -eq $mongoDump) {
              Write-Host "Downloading MongoDB Database Tools..."

              $toolsZip = "C:\mongodb-tools-backup.zip"
              $toolsExtract = "C:\MongoDBTools"

              Invoke-WebRequest `
                "https://fastdl.mongodb.org/tools/db/mongodb-database-tools-windows-x86_64-100.16.1.zip" `
                -OutFile $toolsZip

              if (Test-Path $toolsExtract) {
                  Remove-Item $toolsExtract -Recurse -Force
              }

              Expand-Archive `
                -Path $toolsZip `
                -DestinationPath $toolsExtract `
                -Force

              $mongoDump = Get-ChildItem `
                $toolsExtract `
                -Recurse `
                -Filter "mongodump.exe" `
                -File |
                Select-Object -First 1 |
                Select-Object -ExpandProperty FullName
          }

          if ($null -eq $mongoDump -or !(Test-Path $mongoDump)) {
              throw "mongodump.exe was not found."
          }

          Write-Host "mongodump: $mongoDump"

          if (Test-Path $DumpOut) {
              Remove-Item $DumpOut -Recurse -Force
          }

          New-Item -ItemType Directory -Path $DumpOut -Force | Out-Null

          Write-Host "Running full mongodump..."

          Start-BackupPhase "MongoDB dump"

          & $mongoDump `
            --host "127.0.0.1:27017" `
            --out $DumpOut

          if ($LASTEXITCODE -ne 0) {
              throw "mongodump failed."
          }

          $bsonFiles = Get-ChildItem `
            $DumpOut `
            -Recurse `
            -Filter "*.bson" `
            -File `
            -ErrorAction SilentlyContinue

          if ($null -eq $bsonFiles -or $bsonFiles.Count -eq 0) {
              throw "mongodump produced no BSON files."
          }

          Write-Host "BSON files dumped: $($bsonFiles.Count)"

          Complete-BackupPhase

          $sevenZipPaths = @(
              "C:\Program Files\7-Zip\7z.exe",
              "C:\Program Files (x86)\7-Zip\7z.exe"
          )

          $sevenZip = $null

          foreach ($path in $sevenZipPaths) {
              if (Test-Path $path) {
                  $sevenZip = $path
                  break
              }
          }

          if ($null -eq $sevenZip) {
              Write-Host "Installing 7-Zip..."

              winget install `
                --id 7zip.7zip `
                --exact `
                --silent `
                --accept-package-agreements `
                --accept-source-agreements

              Start-Sleep -Seconds 5

              foreach ($path in $sevenZipPaths) {
                  if (Test-Path $path) {
                      $sevenZip = $path
                      break
                  }
              }
          }

          if ($null -eq $sevenZip -or !(Test-Path $sevenZip)) {
              throw "7-Zip was not found."
          }

          if (Test-Path $BackupZip) {
              Remove-Item $BackupZip -Force
          }

          Write-Host "Stopping Peydak.Api so CLI session files can be copied..."
          Get-Process -Name "Peydak.Api" -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          $CliSessionsDest = "C:\PeydakCliSessions"
          $CliSessionsZip = Join-Path $DumpOut "peydak-cli-sessions.zip"
          if (Test-Path $CliSessionsDest) {
              $sessionFiles = @(Get-ChildItem `
                $CliSessionsDest `
                -Recurse `
                -File `
                -Filter "*.session" `
                -ErrorAction SilentlyContinue)
              if ($sessionFiles.Count -gt 0) {
                  Write-Host "Packing $($sessionFiles.Count) CLI session file(s) from host into backup..."
                  if (Test-Path $CliSessionsZip) {
                      Remove-Item $CliSessionsZip -Force
                  }
                  $sessionNames = $sessionFiles | ForEach-Object { $_.FullName }
                  Compress-Archive -Path $sessionNames -DestinationPath $CliSessionsZip -Force
              }
              else {
                  Write-Host "No CLI session files on host to pack."
              }
          }

          Write-Host "Creating password-protected ZIP..."

          Start-BackupPhase "ZIP archive"

          & $sevenZip a `
            -tzip `
            -mx=9 `
            "-p$Env:BACKUP_PASSWORD" `
            -mem=AES256 `
            $BackupZip `
            "$DumpOut\*"

          if ($LASTEXITCODE -ne 0 -or !(Test-Path $BackupZip)) {
              throw "7-Zip failed to create the backup archive."
          }

          $zipSize = (Get-Item $BackupZip).Length

          if ($zipSize -eq 0) {
              throw "Backup ZIP is empty."
          }

          Complete-BackupPhase

          Write-Host "ZIP created. Size: $zipSize bytes"

          if (!(Test-Path "C:\Peydak-BackupFtp.ps1")) {
              throw "Backup helper missing: C:\Peydak-BackupFtp.ps1"
          }
          . "C:\Peydak-BackupFtp.ps1"

          Write-Host "Validating new local backup before any FTP change..."
          Write-Host "Same path as bot Backup.Ftp.RemoteDirectory/RemoteFileName"

          Start-BackupPhase "FTP upload"
          try {
              $publish = Publish-PeydakBackupToFtp -LocalZip $BackupZip
              $remotePath = $publish.RemotePath
              $zipSize = [long]$publish.LocalSize
          }
          finally {
              Remove-PeydakFtpCurlConfig
          }
          Complete-BackupPhase

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "       >>> BACKUP UPLOADED TO FTP <<<" -ForegroundColor Green
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "Host : $($Env:FTP_HOST)"
          Write-Host "Path : $remotePath"
          Write-Host "Size : $zipSize bytes"
          Write-Host "==================================================" -ForegroundColor Green

          $duration = (Get-Date).ToUniversalTime() - $BackupStartedAtUtc
          $durationText = Format-Duration $duration
          $sizeText = Format-ByteSize $zipSize
          $phaseTimingsText = Get-PhaseTimingsText
          $jobElapsedText = Get-JobElapsedText

          Notify-BackupSucceeded `
            -DurationText $durationText `
            -SizeText $sizeText `
            -ZipBytes $zipSize `
            -BsonCount $publish.BsonCount `
            -FtpHost $Env:FTP_HOST `
            -RemotePath $remotePath `
            -PhaseTimingsText $phaseTimingsText `
            -JobElapsedText $jobElapsedText `
            -SevenZipTest $publish.SevenZip `
            -BsonValidation $publish.Bson `
            -FtpLocalSize $publish.LocalSize `
            -FtpRemoteSize $publish.RemoteSize `
            -FtpVerified $publish.Verified `
            -RotationCurrentToPrevious $publish.CurrentToPrevious `
            -RotationNewToCurrent $publish.NewToCurrent `
            -RestoreSource $Env:BACKUP_SOURCE

          Write-Host "Removing local backup files after FTP upload..."
          Clear-PeydakLocalBackupArtifacts
          if (Test-Path $DumpOut) {
              Remove-Item $DumpOut -Recurse -Force -ErrorAction SilentlyContinue
          }

          }
          catch {
              Complete-BackupPhase

              $errMsg = $_.Exception.Message
              if ([string]::IsNullOrWhiteSpace($errMsg)) { $errMsg = "$_" }

              $duration = (Get-Date).ToUniversalTime() - $BackupStartedAtUtc
              $durationText = Format-Duration $duration
              $phaseTimingsText = Get-PhaseTimingsText
              $jobElapsedText = Get-JobElapsedText

              Notify-BackupFailed `
                -ErrorMessage $errMsg `
                -DurationText $durationText `
                -PhaseTimingsText $phaseTimingsText `
                -JobElapsedText $jobElapsedText

              throw
          }

      # ==========================================
      # 15. Final job status notify (success / failure / cancelled)
      # ==========================================
      - name: 15. Notify final job status
        if: always()
        shell: powershell
        env:
          JOB_STATUS: ${{ job.status }}
        run: |

          if (!(Test-Path "C:\Peydak-TelegramNotify.ps1")) {
              Write-Host "Notifier script missing; skip final notify."
              exit 0
          }

          . "C:\Peydak-TelegramNotify.ps1"
          Notify-JobFinished -JobStatus "$Env:JOB_STATUS"
